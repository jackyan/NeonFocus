name: neonfocus
description: NeonFocus - Cyberpunk aesthetic focus timer with ambient soundscapes
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_bloc: ^8.1.3
  equatable: ^2.0.5
  hydrated_bloc: ^9.1.2

  # UI Components
  flutter_animate: ^4.3.0

  # Local Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.2.2
  path_provider: ^2.1.1

  # Audio
  audioplayers: ^5.2.0
  just_audio: ^0.9.36

  # Sensors & System
  sensors_plus: ^4.0.0
  flutter_local_notifications: ^16.2.0
  wakelock_plus: ^1.1.4
  battery_plus: ^5.0.2
  device_info_plus: ^9.1.1

  # Utils
  intl: ^0.18.1
  uuid: ^4.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Code Generation
  build_runner: ^2.4.7
  hive_generator: ^2.0.1

  # Testing
  bloc_test: ^9.1.5
  mocktail: ^1.0.1

  # Code Quality
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true

  # 临时注释字体配置，使用系统默认字体
